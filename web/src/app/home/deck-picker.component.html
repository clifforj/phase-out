<div
  class="cell deck-cell wide"
  [appPopover]="deckOpen()"
  (appPopoverDismiss)="deckOpen.set(false)"
>
  <span class="field-label">Deck</span>
  <button
    type="button"
    class="deck-trigger"
    [attr.aria-expanded]="deckOpen()"
    (click)="deckOpen.set(!deckOpen())"
  >
    @if (selectedDeck(); as deck) {
      <app-mana-pips [deck]="deck" [size]="12" />
      <span class="deck-name">{{ deck.name }}</span>
      <span class="badge badge-sm" [class.badge-green]="isBuiltIn(deck)">
        {{ isBuiltIn(deck) ? 'Precon' : 'Yours' }}
      </span>
    } @else {
      <span class="pips" style="--pip-size: 12px"><span class="pip pip-C"></span></span>
      <span class="deck-name">Deal me one</span>
      <span class="badge badge-sm">Random</span>
    }
    <span class="chevron" aria-hidden="true">▾</span>
  </button>

  @if (deckOpen()) {
    <div class="popover deck-menu">
      <input
        type="text"
        class="field search"
        placeholder="Search decks"
        aria-label="search decks"
        [value]="deckSearch()"
        (input)="deckSearch.set($any($event.target).value)"
      />

      <div class="deck-list">
        <button
          type="button"
          class="deck-row"
          [class.on]="decks.selectedDeckId() === null"
          (click)="pick(null)"
        >
          <span class="pips" style="--pip-size: 12px"><span class="pip pip-C"></span></span>
          <span class="deck-name">Deal me one</span>
          <span class="badge badge-sm">Random</span>
        </button>

        @for (deck of filteredDecks(); track deck.deckId) {
          <button
            type="button"
            class="deck-row"
            [class.on]="decks.selectedDeckId() === deck.deckId"
            (click)="pick(deck.deckId)"
          >
            @if (art(deck); as url) {
              <img class="thumb" [src]="url" alt="" />
            }
            <app-mana-pips [deck]="deck" [size]="12" />
            <span class="deck-name">{{ deck.name }}</span>
            <span class="badge badge-sm" [class.badge-green]="isBuiltIn(deck)">
              {{ isBuiltIn(deck) ? 'Precon' : 'Yours' }}
            </span>
          </button>
        }

        @if (!filteredDecks().length) {
          <p class="no-decks">
            Nothing matching that. <a routerLink="/decks">Import a deck</a> to add one.
          </p>
        }
      </div>
    </div>
  }
</div>
