gzip on;
gzip_types application/json;
gzip_min_length 1024;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    location /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /card-images.json {
        add_header Cache-Control "no-cache";
    }

    location ~ "^/card-images\.[0-9a-f]{12}\.json$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /token-images.json {
        add_header Cache-Control "no-cache";
    }

    location ~ "^/token-images\.[0-9a-f]{12}\.json$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass         http://game:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        # Must exceed the bridge heartbeat timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /playmats {
        proxy_pass         http://game:8080/playmats;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 6m;
    }
}
